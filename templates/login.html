{% extends "base.html" %}

{% block auth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-5">
    
    <div class="text-center mb-4">
      <div class="bg-primary bg-gradient p-3 rounded-circle text-white d-inline-block shadow mb-3">
        <i class="bi bi-wallet2 fs-1"></i>
      </div>
      <h2 class="fw-bold text-primary">FinSight</h2>
      <p class="text-secondary">Enterprise Personal Wealth & Portfolio Intelligence</p>
    </div>
    
    <div class="card p-4 border-custom">
      <h4 class="fw-bold mb-4">Sign In</h4>
      
      <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email or Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-custom"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control border-custom" id="email" name="email" placeholder="name@bank.com or username" required>
          </div>
        </div>
        
        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label for="password" class="form-label fw-semibold">Password</label>
            <a href="{{ url_for('forgot_password') }}" class="text-decoration-none fs-7 fw-semibold">Forgot Password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-custom"><i class="bi bi-shield-lock"></i></span>
            <input type="password" class="form-control border-custom border-end-0" id="password" name="password" placeholder="••••••••" required>
            <span class="input-group-text bg-white border-custom border-start-0 text-muted" onclick="togglePasswordVisibility('password', this)" style="cursor: pointer;">
              <i class="bi bi-eye"></i>
            </span>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary-gradient w-full w-100 py-2.5 mt-3">Access Account</button>
      </form>

      <div class="mt-3 text-center">
        <button type="button" class="btn btn-sm btn-outline-primary border-custom w-100 py-2" onclick="fillDemoCredentials()">
          <i class="bi bi-person-check me-1"></i> Quick Sign In with Demo Account
        </button>
      </div>
      
      <script>
        function fillDemoCredentials() {
          document.getElementById('email').value = 'demo@finsight.com';
          document.getElementById('password').value = 'password123';
          document.querySelector('form').submit();
        }
      </script>
      
      <div class="text-center mt-4">
        <span class="text-muted-custom fs-7">New to FinSight? </span>
        <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold fs-7">Create an Account</a>
      </div>
    </div>
    
  </div>
</div>
{% endblock %}
